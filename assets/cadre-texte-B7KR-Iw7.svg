<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" fill="none" preserveAspectRatio="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-hard">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#080018" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050010" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.0"/>
      <stop offset="20%"  stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="80%"  stop-color="#DB2777" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Fond solide coins coupés -->
  <polygon
    points="34,0 526,0 560,34 560,646 526,680 34,680 0,646 0,34"
    fill="url(#bg)"/>

  <!-- Barre de titre holographique — épaissie à 75px -->
  <polygon
    points="34,0 526,0 560,34 560,75 0,75 0,34"
    fill="url(#topbar)" filter="url(#soft)"/>
  <line x1="0" y1="75" x2="560" y2="75" stroke="#7C3AED" stroke-width="1.5" filter="url(#soft)"/>
  <line x1="0" y1="75" x2="560" y2="75" stroke="#DB2777" stroke-width="0.5" opacity="0.4"/>

  <!-- Points status — centrés dans la barre -->
  <circle cx="52"  cy="38" r="7" fill="#7C3AED" filter="url(#glow)" opacity="0.95"/>
  <circle cx="72"  cy="38" r="7" fill="#9333EA" filter="url(#glow)" opacity="0.75"/>
  <circle cx="92"  cy="38" r="7" fill="#DB2777" filter="url(#glow)" opacity="0.55"/>



  <!-- Bordure principale -->
  <polygon
    points="34,1 526,1 559,34 559,646 526,679 34,679 1,646 1,34"
    stroke="url(#border)" stroke-width="2" fill="none" filter="url(#glow)"/>

  <!-- Bordure intérieure fine -->
  <polygon
    points="38,8 522,8 552,38 552,642 522,672 38,672 8,642 8,38"
    stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.2" fill="none"/>

  <!-- COIN HAUT GAUCHE cyan -->
  <g filter="url(#glow-hard)">
    <polyline points="1,85 1,34 34,1 90,1" stroke="#22D3EE" stroke-width="5" fill="none" stroke-linecap="square"/>
    <polyline points="1,85 1,34 34,1 90,1" stroke="#fff"    stroke-width="1.5" fill="none" stroke-linecap="square" opacity="0.5"/>
    <rect x="-4" y="-4" width="10" height="10" fill="#22D3EE"/>
    <line x1="95"  y1="1" x2="140" y2="1" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <line x1="1" y1="95"  x2="1" y2="135" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  </g>

  <!-- COIN HAUT DROIT rose -->
  <g filter="url(#glow-hard)">
    <polyline points="559,85 559,34 526,1 470,1" stroke="#DB2777" stroke-width="5" fill="none" stroke-linecap="square"/>
    <polyline points="559,85 559,34 526,1 470,1" stroke="#fff"    stroke-width="1.5" fill="none" stroke-linecap="square" opacity="0.5"/>
    <rect x="553" y="-4" width="10" height="10" fill="#DB2777"/>
    <line x1="465" y1="1" x2="420" y2="1" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <line x1="559" y1="95"  x2="559" y2="135" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  </g>

  <!-- COIN BAS GAUCHE violet -->
  <g filter="url(#glow-hard)">
    <polyline points="1,595 1,646 34,679 90,679" stroke="#9333EA" stroke-width="5" fill="none" stroke-linecap="square"/>
    <polyline points="1,595 1,646 34,679 90,679" stroke="#fff"    stroke-width="1.5" fill="none" stroke-linecap="square" opacity="0.5"/>
    <rect x="-4" y="673" width="10" height="10" fill="#9333EA"/>
    <line x1="95"  y1="679" x2="140" y2="679" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <line x1="1" y1="585"   x2="1"   y2="545" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  </g>

  <!-- COIN BAS DROIT rose -->
  <g filter="url(#glow-hard)">
    <polyline points="559,595 559,646 526,679 470,679" stroke="#DB2777" stroke-width="5" fill="none" stroke-linecap="square"/>
    <polyline points="559,595 559,646 526,679 470,679" stroke="#fff"    stroke-width="1.5" fill="none" stroke-linecap="square" opacity="0.5"/>
    <rect x="520" y="673" width="10" height="10" fill="#DB2777"/>
    <line x1="465" y1="679" x2="420" y2="679" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <line x1="559" y1="585"  x2="559" y2="545" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  </g>

  <!-- Accent milieu gauche -->
  <g filter="url(#soft)">
    <line x1="1" y1="310" x2="1" y2="328" stroke="#9333EA" stroke-width="2.5"/>
    <circle cx="1" cy="334" r="3" fill="#fff"/>
    <line x1="1" y1="340" x2="1" y2="358" stroke="#9333EA" stroke-width="2.5"/>
  </g>

  <!-- Accent milieu droit -->
  <g filter="url(#soft)">
    <line x1="559" y1="310" x2="559" y2="328" stroke="#DB2777" stroke-width="2.5"/>
    <circle cx="559" cy="334" r="3" fill="#fff"/>
    <line x1="559" y1="340" x2="559" y2="358" stroke="#DB2777" stroke-width="2.5"/>
  </g>

  <!-- Accent milieu bas -->
  <g filter="url(#soft)">
    <line x1="220" y1="679" x2="255" y2="679" stroke="#9333EA" stroke-width="2.5"/>
    <circle cx="262" cy="679" r="3" fill="#fff"/>
    <line x1="269" y1="679" x2="304" y2="679" stroke="#DB2777" stroke-width="2.5"/>
  </g>

  <!-- Labels coins -->
  <text x="12"  y="676" font-family="Consolas,monospace" font-size="8" fill="#9333EA" opacity="0.5">0x00</text>
  <text x="548" y="676" font-family="Consolas,monospace" font-size="8" fill="#DB2777" opacity="0.5" text-anchor="end">END</text>

  <!-- Lignes scan subtiles -->
  <line x1="8" y1="340" x2="552" y2="340" stroke="#7C3AED" stroke-width="0.4" stroke-opacity="0.1"/>
  <line x1="8" y1="510" x2="552" y2="510" stroke="#7C3AED" stroke-width="0.4" stroke-opacity="0.07"/>

  <!-- Étoiles discrètes dans la zone contenu -->
  <!-- Blanches -->
  <circle cx="48"  cy="110" r="1.2" fill="#fff" opacity="0.42"/>
  <circle cx="312" cy="98"  r="1.5" fill="#fff" opacity="0.38"/>
  <circle cx="510" cy="130" r="1.1" fill="#fff" opacity="0.40"/>
  <circle cx="88"  cy="210" r="1.3" fill="#fff" opacity="0.32"/>
  <circle cx="480" cy="195" r="1.6" fill="#fff" opacity="0.38"/>
  <circle cx="200" cy="310" r="1.1" fill="#fff" opacity="0.30"/>
  <circle cx="440" cy="350" r="1.3" fill="#fff" opacity="0.35"/>
  <circle cx="70"  cy="420" r="1.2" fill="#fff" opacity="0.38"/>
  <circle cx="520" cy="430" r="1.4" fill="#fff" opacity="0.32"/>
  <circle cx="280" cy="500" r="1.1" fill="#fff" opacity="0.28"/>
  <circle cx="130" cy="560" r="1.3" fill="#fff" opacity="0.35"/>
  <circle cx="430" cy="580" r="1.2" fill="#fff" opacity="0.30"/>
  <circle cx="340" cy="630" r="1.4" fill="#fff" opacity="0.32"/>
  <circle cx="500" cy="650" r="1.1" fill="#fff" opacity="0.28"/>
  <circle cx="60"  cy="640" r="1.3" fill="#fff" opacity="0.30"/>

  <!-- Violettes -->
  <circle cx="160" cy="120" r="1.4" fill="#A855F7" opacity="0.50"/>
  <circle cx="400" cy="145" r="1.2" fill="#A855F7" opacity="0.45"/>
  <circle cx="530" cy="260" r="1.6" fill="#A855F7" opacity="0.42"/>
  <circle cx="30"  cy="300" r="1.3" fill="#A855F7" opacity="0.48"/>
  <circle cx="370" cy="390" r="1.2" fill="#A855F7" opacity="0.38"/>
  <circle cx="110" cy="480" r="1.4" fill="#A855F7" opacity="0.42"/>
  <circle cx="490" cy="520" r="1.3" fill="#A855F7" opacity="0.35"/>
  <circle cx="240" cy="600" r="1.2" fill="#A855F7" opacity="0.40"/>
  <circle cx="390" cy="655" r="1.4" fill="#A855F7" opacity="0.32"/>

  <!-- Rose -->
  <circle cx="230" cy="150" r="1.3" fill="#F472B6" opacity="0.45"/>
  <circle cx="460" cy="220" r="1.4" fill="#F472B6" opacity="0.38"/>
  <circle cx="50"  cy="370" r="1.2" fill="#F472B6" opacity="0.42"/>
  <circle cx="330" cy="450" r="1.6" fill="#F472B6" opacity="0.35"/>
  <circle cx="540" cy="600" r="1.3" fill="#F472B6" opacity="0.32"/>
  <circle cx="170" cy="660" r="1.2" fill="#F472B6" opacity="0.38"/>

  <!-- Cyan -->
  <circle cx="490" cy="95"  r="1.4" fill="#22D3EE" opacity="0.42"/>
  <circle cx="140" cy="250" r="1.3" fill="#22D3EE" opacity="0.38"/>
  <circle cx="420" cy="475" r="1.2" fill="#22D3EE" opacity="0.35"/>
  <circle cx="80"  cy="550" r="1.4" fill="#22D3EE" opacity="0.32"/>
  <circle cx="310" cy="670" r="1.3" fill="#22D3EE" opacity="0.30"/>

</svg>
